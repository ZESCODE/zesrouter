policy_table:
  tiers:
    cheap: deepseek/deepseek-v4-flash-free
    flagship: anthropic/claude-sonnet-5
  fingerprints:
    opening: flagship
    after_read_file: cheap
    after_write_file: cheap
    after_search_files: cheap
    after_terminal: cheap
    midstream: cheap
    after_tool_error: flagship
    after_delegate_task: cheap
  default_tier: flagship
  tool_use_tier: flagship
  tool_safe_tiers: [flagship]
  adequacy:
    enabled: true
    escalation_tier: flagship

plugins:
  bitrouter-observe:
    otel:
      service_name: bitrouter
      resource_attributes:
        service.namespace: zes
        host.name: termux
      sampler: parentbased_always_on
      traces:
        batch:
          max_queue_size: 2048
          flush_ms: 5000
      metrics:
        enabled: true
        export_interval_ms: 10000
      content_capture: "off"
