server:
  listen: 0.0.0.0:4356
  skip_auth: true

providers:
  opencode-zen:
    enabled: true
  openai:
    enabled: true
  anthropic:
    enabled: true
  openrouter:
    enabled: true
    auth:
      kind: bearer
      env: OPENROUTER_API_KEY
  github-copilot:
    enabled: true
  pollinations:
    id: pollinations
    display_name: "Pollinations (no key)"
    class: "third-party-api"
    api_base: "https://gen.pollinations.ai/v1"
    protocol_endpoints:
      chat_completions: https://gen.pollinations.ai/v1
    enabled: true
  opencode-zen-relay:
    id: opencode-zen-relay
    display_name: "OpenCode Zen (keyless relay)"
    class: "third-party-api"
    api_base: "http://127.0.0.1:7077/v1"
    protocol_endpoints:
      chat_completions: http://127.0.0.1:7077/v1
    enabled: true
  nvidia:
    id: nvidia
    display_name: "NVIDIA Build (nvapi)"
    class: "third-party-api"
    api_base: "http://127.0.0.1:9456/v1"
    auth:
      kind: bearer
      env: NVIDIA_API_KEY
    protocol_endpoints:
      chat_completions: http://127.0.0.1:9456/v1
    models:
      - { id: nvidia/z-ai/glm-5.2, provider_model_id: z-ai/glm-5.2 }
      - { id: nvidia/google/gemma-4-31b-it, provider_model_id: google/gemma-4-31b-it }
      - { id: nvidia/openai/gpt-oss-20b, provider_model_id: openai/gpt-oss-20b }
      - { id: nvidia/nvidia/nemotron-3-super-120b-a12b, provider_model_id: nvidia/nemotron-3-super-120b-a12b }
      - { id: nvidia/nvidia/nemotron-3-ultra-550b-a55b, provider_model_id: nvidia/nemotron-3-ultra-550b-a55b }
      - { id: nvidia/meta/llama-3.1-8b-instruct, provider_model_id: meta/llama-3.1-8b-instruct }
      - { id: nvidia/meta/llama-3.2-11b-vision-instruct, provider_model_id: meta/llama-3.2-11b-vision-instruct }
      - { id: nvidia/mistralai/mistral-nemotron, provider_model_id: mistralai/mistral-nemotron }
      - { id: nvidia/nvidia/llama-3.1-nemoguard-8b-content-safety, provider_model_id: nvidia/llama-3.1-nemoguard-8b-content-safety }
      - { id: nvidia/nvidia/llama-3.1-nemoguard-8b-topic-control, provider_model_id: nvidia/llama-3.1-nemoguard-8b-topic-control }
      - { id: nvidia/nvidia/llama-3.1-nemotron-nano-vl-8b-v1, provider_model_id: nvidia/llama-3.1-nemotron-nano-vl-8b-v1 }
      - { id: nvidia/nvidia/llama-3.1-nemotron-safety-guard-8b-v3, provider_model_id: nvidia/llama-3.1-nemotron-safety-guard-8b-v3 }
      - { id: nvidia/nvidia/llama-3.3-nemotron-super-49b-v1, provider_model_id: nvidia/llama-3.3-nemotron-super-49b-v1 }
      - { id: nvidia/nvidia/nemotron-3-nano-omni-30b-a3b-reasoning, provider_model_id: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning }
      - { id: nvidia/nvidia/nemotron-3.5-content-safety, provider_model_id: nvidia/nemotron-3.5-content-safety }
      - { id: nvidia/nvidia/nemotron-3-nano-30b-a3b, provider_model_id: nvidia/nemotron-3-nano-30b-a3b }
      - { id: nvidia/nvidia/nemotron-mini-4b-instruct, provider_model_id: nvidia/nemotron-mini-4b-instruct }
      - { id: nvidia/nvidia/nemotron-nano-12b-v2-vl, provider_model_id: nvidia/nemotron-nano-12b-v2-vl }
      - { id: nvidia/deepseek-ai/deepseek-v4-flash-0731, provider_model_id: deepseek-ai/deepseek-v4-flash-0731 }
      - { id: nvidia/minimaxai/minimax-m3, provider_model_id: minimaxai/minimax-m3 }
    enabled: true

models:
  anthropic/claude-sonnet-5:
